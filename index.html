<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>얼마면 해?</title>
<style>
:root{
  --bg:#17141f; --panel:#231e2e; --line:#3a3348; --ink:#f4f0e8; --muted:#a49cb3;
  --accent:#ffcf3f; --bad:#ff6b5b; --good:#5fd39a;
  --font: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  /* layout: one column of panels, big type for reading across a table */
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);color-scheme:dark;}
main{max-width:480px;margin:0 auto;padding:18px 16px 48px;display:flex;flex-direction:column;gap:14px;}
h1{margin:0;font-size:30px;text-align:center;}
h1 span{color:var(--accent);}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;}
.muted{color:var(--muted);font-size:14px;line-height:1.5;}
.center{text-align:center;}
input{font:inherit;font-size:18px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#120f18;color:var(--ink);width:100%;}
button{font:inherit;font-size:17px;font-weight:700;padding:14px;border-radius:12px;border:0;background:var(--accent);color:#1b1500;cursor:pointer;width:100%;}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-weight:600;}
button:disabled{opacity:.4;}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
.row{display:flex;gap:8px;align-items:center;}
.code{font-size:44px;font-weight:800;letter-spacing:8px;text-align:center;color:var(--accent);font-variant-numeric:tabular-nums;}
#qr{display:flex;justify-content:center;}
#qr img,#qr canvas{background:#fff;padding:8px;border-radius:10px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{background:#120f18;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:15px;}
.chip.off{opacity:.4;}
.chip b{color:var(--accent);}
.q{font-size:24px;font-weight:800;line-height:1.4;text-align:center;text-wrap:balance;}
.q small{display:block;font-size:14px;font-weight:500;color:var(--muted);margin-top:6px;}
.unit{font-size:18px;white-space:nowrap;}
.res{display:flex;flex-direction:column;gap:8px;}
.r{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border-radius:12px;background:#120f18;border:1px solid var(--line);
   opacity:0;animation:pop .35s forwards;}
.r .nm{font-weight:700;} .r .amt{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;}
.r .x{grid-column:1/3;font-size:13px;color:var(--muted);}
.r.lose{border-color:var(--bad);background:#2a1418;} .r.lose .x{color:var(--bad);font-weight:700;}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.r{animation:none;opacity:1;}}
.med{text-align:center;font-size:15px;color:var(--muted);}
.med b{color:var(--good);font-size:20px;}
.big{font-size:22px;font-weight:800;text-align:center;}
.err{background:#3a1717;border:1px solid var(--bad);border-radius:12px;padding:12px;font-size:14px;line-height:1.5;}
.hidden{display:none}
</style>
</head>
<body>
<main id="app"></main>

<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const QUESTIONS = [
  '한 달 동안 휴대폰 없이 살기', '머리 빡빡 밀고 한 달 다니기', '1년 동안 치킨 끊기',
  '부장님이랑 단둘이 2박 3일 여행', '한겨울에 반팔 반바지로 일주일 출근', '평생 라면 금지',
  '지금 이 자리에서 노래 한 곡 완창', '1년 동안 커피 금지', '한 달 동안 매일 새벽 5시 기상',
  '눈썹 한쪽 밀고 일주일 살기', '일주일 동안 엄마한테 하루 일과 실시간 보고', '한 달 동안 엘리베이터 금지, 계단만',
  '일주일 동안 말끝마다 "냥" 붙이기', '한 달 동안 단톡방 모든 메시지에 1분 안에 답장', '1년 동안 배달음식 금지',
  '한 달 동안 프사를 친구가 고른 사진으로', '한 달 동안 신발 대신 슬리퍼만', '한겨울 바다 입수 10초',
  '하루 종일 정장 입고 놀이공원', '한 달 동안 유튜브 금지', '고향 친구 결혼식에서 축가',
  '1년 동안 술 끊기', '혼자 고깃집 가서 4인분 먹고 오기', '매운 라면 5봉지 한 번에 먹기',
  '일주일 동안 가족한테도 존댓말', '노래방에서 트로트만 3시간', '지금 이 자리에서 팔굽혀펴기 50개',
  '내 유튜브 시청 기록 여기서 공개', '한 달 동안 매일 아침 찬물 샤워', '전 직장(학교) 단톡방에 "보고 싶다" 보내기'
];

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

// 금액은 "만원" 단위 숫자로 저장
function won(v) {
  if (v >= 10000) { const eok = Math.floor(v / 10000), man = Math.round(v % 10000); return eok + '억' + (man ? ' ' + man.toLocaleString() + '만' : '') + '원'; }
  return (Math.round(v * 10) / 10).toLocaleString() + '만원';
}

let pid = store.get('party-pid');
if (!pid) { pid = Math.random().toString(36).slice(2, 10); store.set('party-pid', pid); }

const cfg = window.FIREBASE_CONFIG || {};
const configured = cfg.databaseURL && !cfg.databaseURL.includes('YOUR_');
let db = null;
if (configured) { firebase.initializeApp(cfg); db = firebase.database(); }

let code = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
let R = null;           // 방 데이터
let lastKey = '';       // 화면 전체를 다시 그릴지 판단
let revealing = 0;      // 호스트가 같은 라운드를 두 번 공개하지 않게

const roomRef = () => db.ref('rooms/' + code);
const isHost = () => R && R.host === pid;
const players = () => Object.entries(R?.players || {}).map(([id, p]) => ({ id, ...p }));
const online = () => players().filter(p => p.online);
const answers = () => (R?.answers || {})[R?.round] || {};
const joinUrl = () => location.origin + location.pathname + '?room=' + code;

// ---------- 입장 ----------
function homeScreen(msg = '') {
  lastKey = 'home';
  const name = esc(store.get('party-name') || '');
  app.innerHTML = `
    <h1>얼마면 <span>해?</span></h1>
    ${!configured ? `<div class="err">아직 Firebase 설정이 없어요. <b>config.js</b>에 설정값을 넣어야 여러 폰이 연결됩니다.</div>` : ''}
    ${msg ? `<div class="err">${esc(msg)}</div>` : ''}
    <div class="panel">
      <label class="muted" for="name">내 이름</label>
      <input id="name" maxlength="8" placeholder="예: 민수" value="${name}" autocomplete="off">
      ${code ? `
        <div class="muted center">방 <b>${esc(code)}</b>에 들어갑니다</div>
        <button id="join">입장하기</button>` : `
        <button id="create">방 만들기</button>
        <div class="row"><input id="code" maxlength="4" placeholder="방 코드" style="text-transform:uppercase">
          <button id="join" class="ghost" style="width:auto;white-space:nowrap">입장</button></div>`}
    </div>
    <div class="muted center">진행: 질문이 뜨면 각자 "얼마 주면 할지" 몰래 입력 → 동시 공개 →<br><b>가운데 금액에서 제일 먼 사람</b>이 마셔요.</div>`;
  const getName = () => { const n = $('#name').value.trim(); if (!n) { $('#name').focus(); return null; } store.set('party-name', n); return n; };
  $('#create')?.addEventListener('click', () => { const n = getName(); if (n) createRoom(n); });
  $('#join').addEventListener('click', () => {
    const n = getName(); if (!n) return;
    if (!code) code = ($('#code').value || '').trim().toUpperCase();
    if (code.length !== 4) return homeScreen('방 코드 4자리를 넣어주세요.');
    joinRoom(n);
  });
}

async function createRoom(name) {
  if (!db) return homeScreen('Firebase 설정이 필요해요.');
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  for (let i = 0; i < 10; i++) {
    code = Array.from({ length: 4 }, () => A[Math.random() * A.length | 0]).join('');
    if (!(await roomRef().get()).exists()) break;
  }
  await roomRef().set({ host: pid, phase: 'lobby', round: 0, createdAt: firebase.database.ServerValue.TIMESTAMP });
  joinRoom(name);
}

async function joinRoom(name) {
  if (!db) return homeScreen('Firebase 설정이 필요해요.');
  const snap = await roomRef().get();
  if (!snap.exists()) { const c = code; code = ''; history.replaceState(null, '', location.pathname); return homeScreen(`방 ${c}이(가) 없어요.`); }
  history.replaceState(null, '', '?room=' + code);
  const me = roomRef().child('players/' + pid);
  await me.update({ name, online: true });
  me.child('online').onDisconnect().set(false);
  db.ref('.info/connected').on('value', s => { if (s.val()) { me.child('online').set(true); me.child('online').onDisconnect().set(false); } });
  roomRef().on('value', s => { R = s.val(); if (R) render(); });
}

// ---------- 호스트 동작 ----------
function nextQuestion(custom) {
  const used = R.used || {};
  let q = custom, qi = null;
  if (!q) {
    const left = QUESTIONS.map((_, i) => i).filter(i => !used[i]);
    const pool = left.length ? left : QUESTIONS.map((_, i) => i);
    qi = pool[Math.random() * pool.length | 0]; q = QUESTIONS[qi];
  }
  const upd = { phase: 'answer', round: (R.round || 0) + 1, question: q };
  if (qi !== null) upd['used/' + qi] = true;
  roomRef().update(upd);
}

function reveal() {
  if (revealing === R.round) return;
  revealing = R.round;
  const ent = Object.entries(answers()).map(([id, v]) => ({ id, v: Math.max(+v, 0.5) }));
  const logs = ent.map(e => Math.log(e.v)).sort((a, b) => a - b);
  const m = logs.length;
  const medLog = m ? (m % 2 ? logs[(m - 1) / 2] : (logs[m / 2 - 1] + logs[m / 2]) / 2) : 0;
  let maxD = 0; ent.forEach(e => { e.d = Math.abs(Math.log(e.v) - medLog); maxD = Math.max(maxD, e.d); });
  const losers = {};
  if (m >= 2 && maxD > 1e-9) ent.forEach(e => { if (maxD - e.d < 1e-9) losers[e.id] = true; });
  const upd = { phase: 'reveal', ['result/' + R.round]: { median: Math.exp(medLog), losers } };
  Object.keys(losers).forEach(id => { upd['players/' + id + '/drinks'] = (R.players?.[id]?.drinks || 0) + 1; });
  roomRef().update(upd);
}

// ---------- 화면 ----------
function playerChips() {
  return players().sort((a, b) => (b.drinks || 0) - (a.drinks || 0)).map(p =>
    `<span class="chip ${p.online ? '' : 'off'}">${esc(p.name)}${p.id === R.host ? ' 👑' : ''}${p.drinks ? ` <b>🍺${p.drinks}</b>` : ''}</span>`).join('');
}

function render() {
  const mine = answers()[pid] !== undefined;
  const key = [R.phase, R.round, mine, isHost()].join('|');
  if (key === lastKey) return lightUpdate();
  lastKey = key;

  if (R.phase === 'lobby') {
    app.innerHTML = `
      <h1>얼마면 <span>해?</span></h1>
      <div class="panel center">
        <div class="muted">QR을 찍거나 방 코드를 입력하세요</div>
        <div id="qr"></div>
        <div class="code">${esc(code)}</div>
      </div>
      <div class="panel"><div class="muted">들어온 사람 <span id="cnt"></span></div><div class="chips" id="chips"></div></div>
      ${isHost() ? `<button id="start">시작하기</button>
        <div class="panel"><label class="muted" for="cq">직접 질문 내기 (선택)</label>
        <input id="cq" maxlength="60" placeholder="예: 지금 여기서 막춤 1분"><button id="cqb" class="ghost">이 질문으로 시작</button></div>`
        : `<div class="muted center">방장이 시작하면 질문이 떠요.</div>`}`;
    try { new QRCode($('#qr'), { text: joinUrl(), width: 180, height: 180 }); } catch (e) { $('#qr').textContent = joinUrl(); }
    $('#start')?.addEventListener('click', () => nextQuestion());
    $('#cqb')?.addEventListener('click', () => { const q = $('#cq').value.trim(); if (q) nextQuestion(q); });
  }

  else if (R.phase === 'answer') {
    app.innerHTML = `
      <div class="muted center">${R.round}번째 질문</div>
      <div class="panel"><div class="q">${esc(R.question)}<small>얼마 주면 할래?</small></div></div>
      ${mine ? `<div class="panel center"><div class="big">제출 완료 🤫</div><div class="muted">다른 사람 기다리는 중</div></div>`
        : `<div class="panel">
            <div class="row"><input id="amt" type="number" inputmode="decimal" min="0" step="any" placeholder="숫자"><span class="unit">만원</span></div>
            <div class="muted" id="preview">예: 50 → 50만원, 3000 → 3,000만원, 20000 → 2억원</div>
            <button id="sub">몰래 제출</button></div>`}
      <div class="panel"><div class="muted">제출 <span id="cnt"></span></div><div class="chips" id="chips"></div></div>
      ${isHost() ? `<button id="force" class="ghost">기다리지 말고 지금 공개</button>` : ''}`;
    $('#amt')?.addEventListener('input', e => { const v = +e.target.value; $('#preview').textContent = e.target.value === '' ? '' : (v >= 0 ? '= ' + won(v) : '0 이상으로 넣어주세요'); });
    $('#sub')?.addEventListener('click', () => {
      const v = +$('#amt').value;
      if ($('#amt').value === '' || !(v >= 0) || v > 1e8) { $('#amt').focus(); return; }
      roomRef().child('answers/' + R.round + '/' + pid).set(v);
    });
    $('#force')?.addEventListener('click', reveal);
  }

  else if (R.phase === 'reveal') {
    const res = (R.result || {})[R.round] || { median: 0, losers: {} };
    const losers = res.losers || {};
    const rows = Object.entries(answers()).map(([id, v]) => ({ id, v, name: R.players?.[id]?.name || '?' })).sort((a, b) => a.v - b.v);
    const ratio = v => { const r = Math.max(v, 0.5) / res.median; return r >= 1 ? r.toFixed(1) + '배 비쌈' : (1 / r).toFixed(1) + '배 쌈'; };
    const loserNames = rows.filter(r => losers[r.id]).map(r => esc(r.name));
    app.innerHTML = `
      <div class="panel"><div class="q" style="font-size:20px">${esc(R.question)}</div></div>
      <div class="med">가운데 금액 <b>${won(res.median)}</b></div>
      <div class="res">${rows.map((r, i) => `
        <div class="r ${losers[r.id] ? 'lose' : ''}" style="animation-delay:${i * 0.45}s">
          <span class="nm">${esc(r.name)}</span><span class="amt">${won(r.v)}</span>
          <span class="x">${losers[r.id] ? '🍺 제일 멀어요! 마셔!' : ''} 가운데보다 ${ratio(r.v)}</span></div>`).join('')}</div>
      <div class="big" style="opacity:0;animation:pop .4s ${rows.length * 0.45 + 0.3}s forwards">
        ${rows.length < 2 ? '제출한 사람이 2명보다 적어서 이번 판은 무효!' : loserNames.length ? '🍺 ' + loserNames.join(', ') + ' 마셔!' : '🥂 다 똑같아요! 다 같이 건배!'}</div>
      <div class="panel"><div class="muted">누적 🍺</div><div class="chips" id="chips"></div></div>
      ${isHost() ? `<button id="next">다음 질문</button>
        <div class="panel"><label class="muted" for="cq">직접 질문 내기 (선택)</label>
        <input id="cq" maxlength="60" placeholder="예: 지금 여기서 막춤 1분"><button id="cqb" class="ghost">이 질문으로</button>
        <button id="lobby" class="ghost">대기실로 (QR 다시 보기)</button></div>`
        : `<div class="muted center">방장이 다음 질문을 띄울 거예요.</div>`}`;
    $('#next')?.addEventListener('click', () => nextQuestion());
    $('#cqb')?.addEventListener('click', () => { const q = $('#cq').value.trim(); if (q) nextQuestion(q); });
    $('#lobby')?.addEventListener('click', () => roomRef().update({ phase: 'lobby' }));
  }
  lightUpdate();
}

// 입력창을 건드리지 않고 사람 목록·제출 수만 갱신
function lightUpdate() {
  const chips = $('#chips'), cnt = $('#cnt');
  if (R.phase === 'answer') {
    const a = answers(), on = online();
    if (chips) chips.innerHTML = on.map(p => `<span class="chip ${a[p.id] !== undefined ? '' : 'off'}">${a[p.id] !== undefined ? '✅' : '⏳'} ${esc(p.name)}</span>`).join('');
    const done = on.filter(p => a[p.id] !== undefined).length;
    if (cnt) cnt.textContent = `${done}/${on.length}`;
    if (isHost() && on.length >= 2 && done >= on.length) reveal();
  } else {
    if (chips) chips.innerHTML = playerChips();
    if (cnt) cnt.textContent = `${online().length}명`;
  }
}

homeScreen();
</script>
</body>
</html>
